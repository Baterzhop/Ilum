name: Ilum CI

on:
  push:
    branches:
      - integration/ilum-v1
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: IlumCore tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Swift version
        run: swift --version
      - name: Test IlumCore
        working-directory: Packages/IlumCore
        run: swift test

  core-macos:
    name: IlumCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test IlumCore
        working-directory: Packages/IlumCore
        run: swift test
